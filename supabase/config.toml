# Local MSR Jewellers stack. CLI 2.121 supports a native runtime on Apple silicon.
project_id = "msr-jewellers"

[experimental]
stack = true

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17
health_timeout = "120s"

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
api_url = "http://127.0.0.1"

[storage]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:4311"
additional_redirect_urls = ["http://localhost:4311/login", "http://localhost:4310/login"]
enable_signup = false
minimum_password_length = 10

[auth.email]
# This controls the email provider. The global auth.enable_signup=false above
# still prevents public registration while allowing existing users to sign in.
enable_signup = true
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
